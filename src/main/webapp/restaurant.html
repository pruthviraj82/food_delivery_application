<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Restaurant Details</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h2{
    margin-bottom:15px;
}

.detail{
    margin:10px 0;
    font-size:16px;
}

.active{
    color:green;
    font-weight:bold;
}

.inactive{
    color:red;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="card">

    <img src="restaurant.jpg" alt="Restaurant Image">

    <div class="content">

        <h2>Biryani Palace</h2>

        <div class="detail">
            <strong>Restaurant ID:</strong> 101
        </div>

        <div class="detail">
            <strong>Address:</strong> Kalaburagi, Karnataka
        </div>

        <div class="detail">
            <strong>Rating:</strong> ⭐ 4.5
        </div>

        <div class="detail">
            <strong>Status:</strong>
            <span class="active">Active</span>
        </div>

        <div class="detail">
            <strong>Delivery Time:</strong> 30 mins
        </div>

        <div class="detail">
            <strong>Image:</strong> restaurant.jpg
        </div>

    </div>

</div>

</body>
</html>
