<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:'Lora', serif;
        background:#0F0B08;
        color:#F0E6D1;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:30px;
    }

    .container{
        width:100%;
        max-width:1000px;
        display:grid;
        grid-template-columns:1fr 1fr;
        background:#1A130E;
        border-radius:6px;
        overflow:hidden;
        box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    .left-panel{
        background:url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4")
        center/cover;
        position:relative;
    }

    .left-panel::before{
        content:"";
        position:absolute;
        inset:0;
        background:rgba(15,11,8,0.75);
    }

    .left-content{
        position:relative;
        z-index:1;
        height:100%;
        display:flex;
        flex-direction:column;
        justify-content:center;
        padding:40px;
    }

    .brand{
        font-family:'Playfair Display', serif;
        font-size:4rem;
        font-weight:700;
        color:#F0E6D1;
    }

    .tagline{
        margin-top:15px;
        color:#A89574;
        line-height:1.8;
    }

    .form-section{
        padding:40px;
    }

    h1{
        font-family:'Playfair Display', serif;
        font-size:2.4rem;
        margin-bottom:10px;
    }

    .subtitle{
        color:#A89574;
        margin-bottom:30px;
    }

    .form-group{
        margin-bottom:18px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-size:0.74rem;
        letter-spacing:0.2em;
        color:#A89574;
        text-transform:uppercase;
    }

    input,
    textarea,
    select{
        width:100%;
        padding:12px;
        border:1px solid #A89574;
        background:#0F0B08;
        color:#F0E6D1;
        border-radius:4px;
        outline:none;
        font-family:'Lora', serif;
    }

    input:focus,
    textarea:focus,
    select:focus{
        border-color:#D17A2C;
    }

    textarea{
        resize:none;
        height:90px;
    }

    .btn{
        width:100%;
        padding:14px;
        background:#D17A2C;
        color:#F0E6D1;
        border:none;
        border-radius:4px;
        cursor:pointer;
        font-size:16px;
        font-weight:600;
        transition:0.3s;
    }

    .btn:hover{
        opacity:0.9;
        transform:translateY(-2px);
    }

    .login-link{
        text-align:center;
        margin-top:20px;
        color:#A89574;
    }

    .login-link a{
        color:#D17A2C;
        text-decoration:none;
    }

    @media(max-width:768px){
        .container{
            grid-template-columns:1fr;
        }

        .left-panel{
            height:250px;
        }

        .brand{
            font-size:3rem;
        }
    }
</style>
</head>
<body>

<div class="container">

    <div class="left-panel">
        <div class="left-content">
            <h1 class="brand">tomor</h1>
            <p class="tagline">
                Discover the best food & drinks in your city.
                Join our community and explore thousands of restaurants.
            </p>
        </div>
    </div>

    <div class="form-section">

        <h1>Create Account</h1>
        <p class="subtitle">Register to start ordering food.</p>

        <form action="register" method="post">

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" >
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address" required></textarea>
            </div>

            <div class="form-group">
                <label>Role</label>
                <select name="role">
                    <option value="customer">Customer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

</body>
</html>
