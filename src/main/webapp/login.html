<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomor - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Lora', serif;
    background: #0F0B08;
    color: #F0E6D1;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.container {
    width: 100%;
    max-width: 1000px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #1A130E;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.left-panel {
    background: url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4")
    center/cover;
    position: relative;
}

.left-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(15,11,8,0.75);
}

.left-content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px;
}

.brand {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    font-weight: 700;
    color: #F0E6D1;
}

.tagline {
    margin-top: 15px;
    color: #A89574;
    line-height: 1.8;
}

.form-section {
    padding: 50px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    margin-bottom: 10px;
}

.subtitle {
    color: #A89574;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.74rem;
    letter-spacing: 0.2em;
    color: #A89574;
    text-transform: uppercase;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #A89574;
    background: #0F0B08;
    color: #F0E6D1;
    border-radius: 4px;
    outline: none;
    font-family: 'Lora', serif;
    font-size: 15px;
    transition: border-color 0.3s;
}

input:focus {
    border-color: #D17A2C;
}

/* ── Error message ── */
.error-msg {
    background: rgba(209, 50, 50, 0.15);
    border: 1px solid #D13232;
    color: #E57373;
    padding: 12px 16px;
    border-radius: 4px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    display: none;
}

.error-msg.show {
    display: block;
}

/* ── Success message ── */
.success-msg {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid #22c55e;
    color: #22c55e;
    padding: 12px 16px;
    border-radius: 4px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    display: none;
}

.success-msg.show {
    display: block;
}

.btn {
    width: 100%;
    padding: 14px;
    background: #D17A2C;
    color: #F0E6D1;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    font-family: 'Lora', serif;
    transition: 0.3s;
    margin-top: 10px;
}

.btn:hover {
    opacity: 0.9;
    transform: translateY(-2px);
}

.forgot {
    text-align: right;
    margin-top: 6px;
}

.forgot a {
    color: #A89574;
    font-size: 0.85rem;
    text-decoration: none;
    transition: color 0.3s;
}

.forgot a:hover {
    color: #D17A2C;
}

.register-link {
    text-align: center;
    margin-top: 24px;
    color: #A89574;
    font-size: 0.95rem;
}

.register-link a {
    color: #D17A2C;
    text-decoration: none;
    font-weight: 600;
}

.register-link a:hover {
    text-decoration: underline;
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: #A89574;
    font-size: 0.85rem;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    border-top: 1px solid #2E1F14;
}

@media(max-width: 768px) {
    .container {
        grid-template-columns: 1fr;
    }

    .left-panel {
        height: 220px;
    }

    .brand {
        font-size: 3rem;
    }

    .form-section {
        padding: 30px 24px;
    }
}
</style>
</head>
<body>

<div class="container">

    <!-- ── Left Panel ── -->
    <div class="left-panel">
        <div class="left-content">
            <h1 class="brand">tomor</h1>
            <p class="tagline">
                Welcome back.<br>
                Your next great meal is just a login away.
            </p>
        </div>
    </div>

    <!-- ── Form Section ── -->
    <div class="form-section">

        <h1>Welcome Back</h1>
        <p class="subtitle">Login to continue ordering.</p>

        <!-- Error message — shown by servlet -->
        <div class="error-msg" id="errorMsg">
            Invalid email or password. Please try again.
        </div>

        <!-- Success message — shown after registration -->
        <div class="success-msg" id="successMsg">
            Account created! Please login.
        </div>

        <form action="login" method="post">

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Enter your password" required>
                <div class="forgot">
                    <a href="#">Forgot password?</a>
                </div>
            </div>

            <button type="submit" class="btn">Login</button>

        </form>

        <div class="divider">or</div>

        <div class="register-link">
            Don't have an account?
            <a href="index.html">Create Account</a>
        </div>

    </div>

</div>

</body>
</html>
